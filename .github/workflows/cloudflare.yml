name: Cloudflare validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # These values only satisfy build validation. Tests never use live data services.
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:8787
      NEXT_PUBLIC_TRPC_BASE_URL: http://localhost:8787/api/trpc
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: cloudflare-validation
      BETTER_AUTH_URL: http://localhost:8787
      BETTER_AUTH_SECRET: cloudflare-validation-secret-not-for-production
      DATABASE_URL: postgresql://validation:validation@example.invalid/invoicely
      GOOGLE_CLIENT_ID: cloudflare-validation
      GOOGLE_CLIENT_SECRET: cloudflare-validation
      CF_R2_ENDPOINT: https://example.invalid
      CF_R2_BUCKET_NAME: cloudflare-validation
      CF_R2_PUBLIC_DOMAIN: https://example.invalid
      CF_R2_ACCESS_KEY_ID: cloudflare-validation
      CF_R2_SECRET_ACCESS_KEY: cloudflare-validation
      SENTRY_AUTH_TOKEN: ""
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build:cloudflare
      - name: Validate production and staging bundles
        run: |
          yarn workspace web wrangler deploy --dry-run --env ""
          yarn workspace web wrangler deploy --dry-run --env staging
      - name: Prepare isolated preview variables
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          const names = Object.keys(process.env).filter((name) =>
            /^(NEXT_PUBLIC_|BETTER_AUTH_|GOOGLE_|CF_R2_)/.test(name) || name === "DATABASE_URL"
          );
          writeFileSync("apps/web/.dev.vars", names.map((name) => `${name}=${JSON.stringify(process.env[name])}`).join("\n"));
          JS
      - name: Exercise the built app in Workers
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace web preview:cloudflare --ip 127.0.0.1 --port 8787 > /tmp/invoicely-worker.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/auth/get-session > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/invoicely-worker.log
              exit 1
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8787 yarn test:cloudflare || { cat /tmp/invoicely-worker.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: worker-preview-log
          path: /tmp/invoicely-worker.log
          if-no-files-found: ignore
