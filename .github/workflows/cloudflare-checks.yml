name: Cloudflare checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inert build values satisfy environment validation without accessing remote data.
    env:
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8787
      NEXT_PUBLIC_TRPC_BASE_URL: http://127.0.0.1:8787/api/trpc
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: cloudflare-build-check
      BETTER_AUTH_URL: http://127.0.0.1:8787
      BETTER_AUTH_SECRET: cloudflare-build-check-secret-for-local-checks-only
      DATABASE_URL: postgresql://smoke:smoke@example.invalid/invoicely
      GOOGLE_CLIENT_ID: cloudflare-build-check
      GOOGLE_CLIENT_SECRET: cloudflare-build-check
      CF_R2_ENDPOINT: https://example.invalid
      CF_R2_BUCKET_NAME: cloudflare-build-check
      CF_R2_PUBLIC_DOMAIN: https://example.invalid
      CF_R2_ACCESS_KEY_ID: cloudflare-build-check
      CF_R2_SECRET_ACCESS_KEY: cloudflare-build-check
      SENTRY_AUTH_TOKEN: ""
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:cloudflare
      - run: yarn workspace web wrangler deploy --dry-run --env ""
      - run: yarn workspace web wrangler deploy --dry-run --env staging
