name: Report Cloudflare build and migrations

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      check_run_id:
        description: Cloudflare check run ID to report again
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  observe:
    # This job only reads GitHub data and runs trusted default-branch code.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: cloudflare-build-observer-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    outputs:
      check_id: ${{ steps.observe.outputs.check_id }}
      head_sha: ${{ steps.observe.outputs.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Observe the native Cloudflare build
        id: observe
        run: node scripts/report-build.mjs observe
        env:
          GH_TOKEN: ${{ github.token }}
  report:
    needs: [observe]
    if: >-
      always() &&
      (needs.observe.outputs.check_id != '' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'check_run' &&
        github.event.check_run.app.id == 85455 &&
        github.event.check_run.name == 'Workers Builds: invoicely-web'))
    # Observers and immediate events for a commit share comment serialization.
    # Separate commits cannot replace each other's pending reporting jobs.
    concurrency:
      group: cloudflare-build-report-${{ github.event.check_run.head_sha || needs.observe.outputs.head_sha || format('manual-{0}', inputs.check_run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch code, never a PR or check-run SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Update the matching PR report
        run: node scripts/report-build.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ needs.observe.outputs.check_id || inputs.check_run_id }}
